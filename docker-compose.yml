services:
  mysql:
    image: mysql:8.0
    container_name: clipai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      clipaiapp
      MYSQL_USER:          clipai
      MYSQL_PASSWORD:      clipai_dev
    ports:
      - "3306:3306"
    volumes:
      - clipai-mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

volumes:
  clipai-mysql-data:
