name: Backend — Build & Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/backend/target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('src/backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          SQLX_OFFLINE: "true"

      - name: Package for deployment
        run: |
          mkdir -p deploy
          cp target/x86_64-unknown-linux-musl/release/clipai-backend deploy/
          cp -r migrations deploy/
          chmod +x deploy/clipai-backend
          printf '#!/bin/bash\nfuser -k 8080/tcp 2>/dev/null || true\nexec /home/site/wwwroot/clipai-backend\n' > deploy/startup.sh
          chmod +x deploy/startup.sh
          cd deploy && zip -r ../clipai-deploy.zip .

      - name: Deploy to Azure App Service
        run: |
          HTTP=$(curl -s -o /tmp/deploy-response.txt -w "%{http_code}" \
            -X POST \
            -u '${{ secrets.AZURE_DEPLOY_USER }}:${{ secrets.AZURE_DEPLOY_PWD }}' \
            -H "Content-Type: application/zip" \
            "https://clipai.scm.azurewebsites.net/api/zipdeploy" \
            --data-binary @clipai-deploy.zip)
          cat /tmp/deploy-response.txt
          echo "HTTP status: $HTTP"
          [ "$HTTP" = "200" ] || exit 1
